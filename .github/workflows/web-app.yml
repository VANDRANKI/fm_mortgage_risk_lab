name: Web app test and build

on:
  push:
    branches: [ "main" ]
    paths: [ "fm-risk-lab-web/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "fm-risk-lab-web/**" ]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: fm-risk-lab-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: fm-risk-lab-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
